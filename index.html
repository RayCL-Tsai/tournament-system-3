<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Beyblade X 賽事管理系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans" x-data="tournamentApp()" x-init="init()">

  <!-- Toast Notification -->
  <div x-show="toast.show" x-transition x-cloak class="fixed top-5 right-5 z-50 bg-indigo-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-indigo-400">
    <i class="fa-solid fa-circle-info text-xl"></i>
    <span x-text="toast.message" class="font-medium"></span>
  </div>

  <div class="max-w-6xl mx-auto px-4 py-6">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-3 rounded-xl">
          <i class="fa-solid fa-trophy text-2xl text-yellow-400"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">
            Beyblade X 賽事管理系統
          </h1>
          <p class="text-xs text-slate-400">當前模式：<span class="font-semibold text-indigo-300" x-text="systemModeText"></span></p>
        </div>
      </div>

      <div class="flex flex-wrap gap-2">
        <button @click="copyViewerLink()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm transition flex items-center gap-2">
          <i class="fa-solid fa-share-nodes text-indigo-400"></i> 複製觀眾連結
        </button>
        <button @click="toggleMode()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm transition flex items-center gap-2 font-medium">
          <i class="fa-solid" :class="isHost ? 'fa-eye' : 'fa-user-gear'"></i>
          <span x-text="isHost ? '切換至觀眾視角' : '切換至主控端'"></span>
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="flex space-x-2 border-b border-slate-700 mb-6">
      <button @click="activeTab = 'matches'" :class="activeTab === 'matches' ? 'border-indigo-500 text-indigo-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'" class="py-3 px-5 border-b-2 transition flex items-center gap-2">
        <i class="fa-solid fa-gamepad"></i> 對戰桌次
      </button>
      <button @click="activeTab = 'rankings'" :class="activeTab === 'rankings' ? 'border-indigo-500 text-indigo-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'" class="py-3 px-5 border-b-2 transition flex items-center gap-2">
        <i class="fa-solid" :class="tournamentType === 'knockout' ? 'fa-sitemap' : 'fa-list-ol'"></i>
        <span x-text="tournamentType === 'knockout' ? '樹狀賽程圖' : '即時排行榜'"></span>
      </button>
      <button x-show="isHost" @click="activeTab = 'settings'" :class="activeTab === 'settings' ? 'border-indigo-500 text-indigo-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'" class="py-3 px-5 border-b-2 transition flex items-center gap-2">
        <i class="fa-solid fa-sliders"></i> 賽事設定
      </button>
    </nav>

    <!-- Tab 1: 對戰桌次 (Matches) -->
    <main x-show="activeTab === 'matches'">
      <div class="flex justify-between items-center mb-6 bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
        <div>
          <h2 class="text-xl font-bold flex items-center gap-2">
            <span>第 <span class="text-indigo-400" x-text="currentRound"></span> 輪賽事</span>
            <span class="text-xs bg-indigo-900/80 text-indigo-300 px-2 py-0.5 rounded border border-indigo-700" x-text="tournamentType === 'knockout' ? '單淘汰賽' : '瑞士制'"></span>
          </h2>
        </div>
        <button x-show="isHost" @click="nextRound()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold shadow-lg transition flex items-center gap-2">
          <span>下一輪賽事</span> <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <!-- Match Cards Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <template x-for="(match, idx) in currentMatches" :key="idx">
          <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 relative shadow-md">
            <div class="flex justify-between items-center mb-3 text-xs text-slate-400 border-b border-slate-700/60 pb-2">
              <span class="font-bold text-slate-300" x-text="'桌次 ' + (idx + 1)"></span>
              <span x-text="match.completed ? '已完成' : '進行中'" :class="match.completed ? 'text-emerald-400' : 'text-amber-400'"></span>
            </div>

            <!-- Player 1 -->
            <div class="flex justify-between items-center my-2 p-2 rounded-lg bg-slate-900/50">
              <span class="font-medium text-lg" x-text="match.p1"></span>
              <div class="flex items-center gap-2" x-show="tournamentType === 'knockout'">
                <button x-show="isHost" @click="setWinner(idx, match.p1)" :class="match.winner === match.p1 ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'" class="px-3 py-1 rounded text-sm transition font-bold">
                  <i class="fa-solid fa-trophy mr-1"></i> 勝出
                </button>
              </div>
            </div>

            <div class="text-center text-xs text-slate-500 font-bold my-1">VS</div>

            <!-- Player 2 -->
            <div class="flex justify-between items-center my-2 p-2 rounded-lg bg-slate-900/50">
              <span class="font-medium text-lg" x-text="match.p2"></span>
              <div class="flex items-center gap-2" x-show="tournamentType === 'knockout'">
                <button x-show="isHost" @click="setWinner(idx, match.p2)" :class="match.winner === match.p2 ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'" class="px-3 py-1 rounded text-sm transition font-bold">
                  <i class="fa-solid fa-trophy mr-1"></i> 勝出
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </main>

    <!-- Tab 2: 即時排行榜 / 樹狀圖 (Rankings / Bracket) -->
    <main x-show="activeTab === 'rankings'">
      <!-- 單淘汰樹狀圖視角 -->
      <template x-if="tournamentType === 'knockout'">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 overflow-x-auto">
          <h3 class="text-lg font-bold mb-4 text-indigo-300"><i class="fa-solid fa-sitemap mr-2"></i>單淘汰對戰樹狀圖</h3>
          <div class="flex gap-8 min-w-[600px]">
            <template x-for="(roundMatches, rIdx) in bracketHistory" :key="rIdx">
              <div class="flex flex-col justify-around flex-1 gap-4">
                <div class="text-xs font-bold text-slate-400 text-center uppercase tracking-wider mb-2" x-text="'第 ' + (rIdx + 1) + ' 輪'"></div>
                <template x-for="m in roundMatches" :key="m.id">
                  <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 space-y-2">
                    <div class="flex justify-between text-sm" :class="m.winner === m.p1 ? 'text-emerald-400 font-bold' : 'text-slate-300'">
                      <span x-text="m.p1 || 'TBD'"></span>
                      <i x-show="m.winner === m.p1" class="fa-solid fa-check text-xs"></i>
                    </div>
                    <div class="border-t border-slate-800"></div>
                    <div class="flex justify-between text-sm" :class="m.winner === m.p2 ? 'text-emerald-400 font-bold' : 'text-slate-300'">
                      <span x-text="m.p2 || 'TBD'"></span>
                      <i x-show="m.winner === m.p2" class="fa-solid fa-check text-xs"></i>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- 瑞士制排行榜視角 -->
      <template x-if="tournamentType === 'swiss'">
        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-900/80 text-slate-400 text-sm border-b border-slate-700">
                <th class="p-4">排名</th>
                <th class="p-4">選手名稱</th>
                <th class="p-4">勝分 (Wins)</th>
                <th class="p-4">敗分 (Losses)</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(p, rank) in sortedPlayers" :key="p.name">
                <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 transition">
                  <td class="p-4 font-bold text-indigo-400" x-text="rank + 1"></td>
                  <td class="p-4 font-semibold" x-text="p.name"></td>
                  <td class="p-4 text-emerald-400 font-bold" x-text="p.wins"></td>
                  <td class="p-4 text-rose-400 font-bold" x-text="p.losses"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </main>

    <!-- Tab 3: 賽事設定 (Settings) -->
    <main x-show="activeTab === 'settings' && isHost">
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-6">
        <h2 class="text-xl font-bold border-b border-slate-700 pb-3 flex items-center gap-2">
          <i class="fa-solid fa-gear text-indigo-400"></i> 賽事基本設定
        </h2>

        <!-- 賽制選擇 -->
        <div class="space-y-2">
          <label class="block font-medium text-slate-300">選擇賽制模式</label>
          <div class="grid grid-cols-2 gap-4">
            <button @click="changeTournamentType('swiss')" :class="tournamentType === 'swiss' ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'" class="p-4 rounded-xl border font-bold text-center transition flex flex-col items-center gap-2">
              <i class="fa-solid fa-diagram-project text-2xl"></i>
              <span>瑞士制 (Swiss System)</span>
            </button>
            <button @click="changeTournamentType('knockout')" :class="tournamentType === 'knockout' ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'" class="p-4 rounded-xl border font-bold text-center transition flex flex-col items-center gap-2">
              <i class="fa-solid fa-sitemap text-2xl"></i>
              <span>單淘汰賽 (Single Elimination)</span>
            </button>
          </div>
        </div>

        <!-- 選手名單管理 -->
        <div class="space-y-2">
          <label class="block font-medium text-slate-300">選手名單 (每行一名選手)</label>
          <textarea x-model="rawPlayerNames" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500 font-mono" placeholder="請輸入選手姓名..."></textarea>
        </div>

        <!-- 重新重置按鈕 -->
        <div class="pt-4 border-t border-slate-700 flex justify-end">
          <button @click="applySettingsAndReset()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition flex items-center gap-2">
            <i class="fa-solid fa-rotate-right"></i> 套用設定並重新開始賽程
          </button>
        </div>
      </div>
    </main>

  </div>

  <script>
    function tournamentApp() {
      return {
        isHost: true,
        activeTab: 'matches',
        tournamentType: 'swiss', // 'swiss' 或 'knockout'
        currentRound: 1,
        rawPlayerNames: '選手 A\n選手 B\n選手 C\n選手 D\n選手 E\n選手 F\n選手 G\n選手 H',
        players: [],
        currentMatches: [],
        bracketHistory: [],
        toast: { show: false, message: '' },

        get systemModeText() {
          return this.isHost ? '主控端 (可編輯)' : '觀眾端 (僅供檢視)';
        },

        get sortedPlayers() {
          return [...this.players].sort((a, b) => b.wins - a.wins || a.losses - b.losses);
        },

        init() {
          const urlParams = new URLSearchParams(window.location.search);
          if (urlParams.get('mode') === 'viewer') {
            this.isHost = false;
          }
          this.applySettingsAndReset();
        },

        showNotification(msg) {
          this.toast.message = msg;
          this.toast.show = true;
          setTimeout(() => { this.toast.show = false; }, 3000);
        },

        toggleMode() {
          this.isHost = !this.isHost;
          if (!this.isHost && this.activeTab === 'settings') {
            this.activeTab = 'matches';
          }
          this.showNotification(`已切換為：${this.systemModeText}`);
        },

        copyViewerLink() {
          const url = new URL(window.location.href);
          url.searchParams.set('mode', 'viewer');
          navigator.clipboard.writeText(url.toString()).then(() => {
            this.showNotification('觀眾端專用連結已複製到剪貼簿！');
          });
        },

        changeTournamentType(type) {
          this.tournamentType = type;
        },

        applySettingsAndReset() {
          const names = this.rawPlayerNames.split('\n').map(n => n.trim()).filter(n => n.length > 0);
          if (names.length < 2) {
            this.showNotification('請至少輸入 2 位選手名稱！');
            return;
          }

          this.players = names.map(name => ({ name, wins: 0, losses: 0 }));
          this.currentRound = 1;
          this.bracketHistory = [];

          this.generateRoundMatches();
          this.activeTab = 'matches';
          this.showNotification('賽事已重新設定並生成第一輪賽程！');
        },

        generateRoundMatches() {
          this.currentMatches = [];

          if (this.tournamentType === 'knockout') {
            let activePool = [];
            if (this.currentRound === 1) {
              activePool = [...this.players.map(p => p.name)];
            } else {
              const prevRoundMatches = this.bracketHistory[this.currentRound - 2];
              activePool = prevRoundMatches.map(m => m.winner).filter(Boolean);
            }

            if (activePool.length <= 1) {
              this.showNotification('單淘汰賽事已全部結束！冠軍為：' + (activePool[0] || '無'));
              return;
            }

            for (let i = 0; i < activePool.length; i += 2) {
              this.currentMatches.push({
                id: `r${this.currentRound}_m${i/2}`,
                p1: activePool[i],
                p2: activePool[i+1] || '輪空 (BYE)',
                winner: activePool[i+1] ? null : activePool[i],
                completed: !activePool[i+1]
              });
            }
          } else {
            // 瑞士制簡化配對
            const pool = [...this.players].sort(() => Math.random() - 0.5);
            for (let i = 0; i < pool.length; i += 2) {
              this.currentMatches.push({
                id: `swiss_r${this.currentRound}_m${i/2}`,
                p1: pool[i].name,
                p2: pool[i+1] ? pool[i+1].name : '輪空',
                winner: pool[i+1] ? null : pool[i].name,
                completed: !pool[i+1]
              });
            }
          }
        },

        setWinner(matchIndex, winnerName) {
          const match = this.currentMatches[matchIndex];
          match.winner = winnerName;
          match.completed = true;
        },

        nextRound() {
          const uncompleted = this.currentMatches.some(m => !m.completed);
          if (uncompleted) {
            this.showNotification('還有桌次尚未登記勝負，請先完成比賽！');
            return;
          }

          // 紀錄本輪
          this.bracketHistory.push(JSON.parse(JSON.stringify(this.currentMatches)));

          // 更新戰績分數
          this.currentMatches.forEach(m => {
            if (m.winner) {
              const pWin = this.players.find(p => p.name === m.winner);
              if (pWin) pWin.wins++;
              const loserName = (m.winner === m.p1) ? m.p2 : m.p1;
              const pLose = this.players.find(p => p.name === loserName);
              if (pLose) pLose.losses++;
            }
          });

          this.currentRound++;
          this.generateRoundMatches();
        }
      }
    }
  </script>
</body>
</html>

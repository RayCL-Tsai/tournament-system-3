<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beyblade X 賽事管理系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans" x-data="tournamentApp()" x-init="init()">

  <!-- Toast Notification -->
  <div x-show="toast.show" x-transition x-cloak class="fixed top-5 right-5 z-50 bg-indigo-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-indigo-400">
    <i class="fa-solid fa-circle-info text-xl"></i>
    <span x-text="toast.message" class="font-medium"></span>
  </div>

  <div class="max-w-6xl mx-auto px-4 py-6">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-3 rounded-xl">
          <i class="fa-solid fa-trophy text-2xl text-yellow-400"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">
            Beyblade X 賽事管理系統
          </h1>
          <p class="text-xs text-slate-400">當前模式：<span class="font-semibold text-indigo-300" x-text="systemModeText"></span> | 狀態：<span class="text-emerald-400" x-text="cloudStatus"></span></p>
        </div>
      </div>

      <div class="flex flex-wrap gap-2">
        <button @click="copyViewerLink()" :class="!roomReady ? 'opacity-50 cursor-not-allowed' : ''" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm transition flex items-center gap-2">
          <i class="fa-solid fa-share-nodes text-indigo-400"></i> 
          <span x-text="roomReady ? '複製即時觀眾連結' : '雲端連線中...'"></span>
        </button>
        <button @click="toggleMode()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm transition flex items-center gap-2 font-medium">
          <i class="fa-solid" :class="isHost ? 'fa-eye' : 'fa-user-gear'"></i>
          <span x-text="isHost ? '切換至觀眾視角' : '切換至主控端'"></span>
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="flex space-x-2 border-b border-slate-700 mb-6">
      <button @click="activeTab = 'matches'" :class="activeTab === 'matches' ? 'border-indigo-500 text-indigo-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'" class="py-3 px-5 border-b-2 transition flex items-center gap-2">
        <i class="fa-solid fa-gamepad"></i> 對戰桌次
      </button>
      <button @click="activeTab = 'rankings'" :class="activeTab === 'rankings' ? 'border-indigo-500 text-indigo-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'" class="py-3 px-5 border-b-2 transition flex items-center gap-2">
        <i class="fa-solid" :class="tournamentType === 'knockout' ? 'fa-sitemap' : 'fa-list-ol'"></i>
        <span x-text="tournamentType === 'knockout' ? '樹狀賽程圖' : '即時排行榜'"></span>
      </button>
      <!-- 嚴格限制：僅主控端可見賽事設定分頁 -->
      <button x-show="isHost" @click="activeTab = 'settings'" :class="activeTab === 'settings' ? 'border-indigo-500 text-indigo-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'" class="py-3 px-5 border-b-2 transition flex items-center gap-2">
        <i class="fa-solid fa-sliders"></i> 賽事設定
      </button>
    </nav>

    <!-- Tab 1: 對戰桌次 (Matches) -->
    <main x-show="activeTab === 'matches'" class="space-y-6">
      <div class="flex justify-between items-center bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
        <div>
          <h2 class="text-xl font-bold flex items-center gap-2">
            <span>
              <template x-if="tournamentType === 'swiss'">
                <span>第 <span class="text-indigo-400" x-text="currentRound"></span> 輪 / 共 <span x-text="totalRounds"></span> 輪</span>
              </template>
              <template x-if="tournamentType === 'knockout'">
                <span>單淘汰賽階段</span>
              </template>
            </span>
            <span class="text-xs bg-indigo-900/80 text-indigo-300 px-2 py-0.5 rounded border border-indigo-700" x-text="tournamentType === 'knockout' ? '單淘汰賽 (含季殿軍)' : '瑞士制'"></span>
          </h2>
        </div>
        <button x-show="isHost && !isTournamentFinished" @click="nextRound()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold shadow-lg transition flex items-center gap-2">
          <span>進入下一輪</span> <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <!-- Tournament Finished Banner -->
      <div x-show="isTournamentFinished" class="bg-gradient-to-r from-emerald-900/90 via-teal-900/90 to-slate-900 p-6 rounded-2xl border border-emerald-500 text-center space-y-4 shadow-2xl">
        <i class="fa-solid fa-crown text-4xl text-yellow-400 animate-bounce"></i>
        <h3 class="text-2xl font-bold text-white">賽事已圓滿結束！最終名次公布</h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 max-w-3xl mx-auto pt-2" x-show="podium.first">
          <!-- 冠軍 -->
          <div class="bg-slate-900/90 border-2 border-yellow-400 rounded-xl p-4 flex flex-col items-center shadow-lg">
            <span class="text-xs font-bold text-yellow-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-trophy mr-1"></i>冠軍 Champion</span>
            <span class="text-xl font-extrabold text-white" x-text="podium.first || '-'"></span>
          </div>
          <!-- 亞軍 -->
          <div class="bg-slate-900/90 border-2 border-slate-300 rounded-xl p-4 flex flex-col items-center shadow-lg">
            <span class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-1"><i class="fa-solid fa-medal mr-1"></i>亞軍 2nd Place</span>
            <span class="text-xl font-extrabold text-white" x-text="podium.second || '-'"></span>
          </div>
          <!-- 季軍 -->
          <div class="bg-slate-900/90 border-2 border-amber-600 rounded-xl p-4 flex flex-col items-center shadow-lg">
            <span class="text-xs font-bold text-amber-500 uppercase tracking-wider mb-1"><i class="fa-solid fa-award mr-1"></i>季軍 3rd Place</span>
            <span class="text-xl font-extrabold text-white" x-text="podium.third || '-'"></span>
          </div>
        </div>
        <p x-show="podium.fourth" class="text-slate-300 text-sm font-medium">殿軍（第 4 名）：<span class="text-indigo-300 font-bold" x-text="podium.fourth"></span></p>
      </div>

      <!-- 三強循環賽即時積分預覽表 -->
      <template x-if="tournamentType === 'knockout' && currentMatches.some(m => m.isRoundRobinGroup)">
        <div class="bg-slate-800/90 border border-indigo-500/40 rounded-xl p-4 shadow-md">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-3 gap-2">
            <h3 class="text-sm font-bold text-indigo-300 flex items-center gap-2">
              <i class="fa-solid fa-ranking-star"></i> 三強小組循環賽 即時戰況（先比勝場，同勝場比總得分，若再同分則自動加賽）
            </h3>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <template x-for="(stat, sIdx) in roundRobinLiveStandings" :key="stat.name">
              <div class="bg-slate-900/80 border border-slate-700 rounded-lg p-3 flex justify-between items-center">
                <div class="flex items-center gap-2">
                  <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold" :class="sIdx === 0 ? 'bg-yellow-500 text-slate-950' : (sIdx === 1 ? 'bg-slate-300 text-slate-950' : 'bg-amber-700 text-white')" x-text="sIdx + 1"></span>
                  <span class="font-bold text-slate-100" x-text="stat.name"></span>
                </div>
                <div class="text-xs space-x-2">
                  <span class="text-emerald-400 font-bold" x-text="stat.wins + ' 勝'"></span>
                  <span class="text-indigo-300 font-bold" x-text="stat.points + ' 分'"></span>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Match Cards Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <template x-for="(match, idx) in currentMatches" :key="idx">
          <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 relative shadow-md">
            <div class="flex justify-between items-center mb-3 text-xs text-slate-400 border-b border-slate-700/60 pb-2">
              <span class="font-bold text-slate-300" x-text="match.title || ('桌次 ' + (idx + 1))"></span>
              <span x-text="match.completed ? '已完成' : '進行中'" :class="match.completed ? 'text-emerald-400' : 'text-amber-400'"></span>
            </div>

            <!-- Player 1 -->
            <div class="flex flex-col md:flex-row justify-between items-center my-2 p-3 rounded-lg border transition" :class="match.winner && match.winner === match.p1 ? 'bg-emerald-950/40 border-emerald-500/80 ring-1 ring-emerald-500' : 'bg-slate-900/50 border-transparent gap-2'">
              <div class="flex items-center gap-2">
                <span class="font-medium text-lg" x-text="match.p1 || '等待晉級 (TBD)'"></span>
                <template x-if="match.winner && match.winner === match.p1">
                  <span class="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded font-bold shadow"><i class="fa-solid fa-crown mr-1"></i>勝出</span>
                </template>
              </div>
              <div class="flex items-center gap-2">
                <template x-if="tournamentType === 'swiss' || match.isRoundRobinGroup || match.isTieBreaker">
                  <div class="flex flex-wrap gap-1 justify-end">
                    <template x-for="score in [0,1,2,3,4,5,6]">
                      <button @click="isHost && match.p1 && match.p2 && (match.isRoundRobinGroup || match.isTieBreaker ? setRoundRobinScore(idx, 'p1', score) : setSwissScore(idx, 'p1', score))" :class="match.score1 === score ? 'bg-indigo-600 text-white shadow ring-2 ring-indigo-300' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="w-8 h-8 rounded text-xs font-bold border border-slate-700 transition" x-text="score"></button>
                    </template>
                  </div>
                </template>
                <template x-if="tournamentType === 'knockout' && !match.isRoundRobinGroup && !match.isTieBreaker">
                  <button x-show="isHost && match.p1 && match.p1 !== '等待晉級 (TBD)' && match.p1 !== '輪空 (BYE)'" @click="setWinner(idx, match.p1)" :class="match.winner === match.p1 ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'" class="px-3 py-1.5 rounded text-sm transition font-bold">
                    <i class="fa-solid fa-trophy mr-1"></i> 勝出
                  </button>
                </template>
              </div>
            </div>

            <div class="text-center text-xs text-slate-500 font-bold my-1">VS</div>

            <!-- Player 2 -->
            <div class="flex flex-col md:flex-row justify-between items-center my-2 p-3 rounded-lg border transition" :class="match.winner && match.winner === match.p2 ? 'bg-emerald-950/40 border-emerald-500/80 ring-1 ring-emerald-500' : 'bg-slate-900/50 border-transparent gap-2'">
              <div class="flex items-center gap-2">
                <span class="font-medium text-lg" x-text="match.p2 || '等待晉級 (TBD)'"></span>
                <template x-if="match.winner && match.winner === match.p2">
                  <span class="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded font-bold shadow"><i class="fa-solid fa-crown mr-1"></i>勝出</span>
                </template>
              </div>
              <div class="flex items-center gap-2">
                <template x-if="tournamentType === 'swiss' || match.isRoundRobinGroup || match.isTieBreaker">
                  <div class="flex flex-wrap gap-1 justify-end">
                    <template x-for="score in [0,1,2,3,4,5,6]">
                      <button @click="isHost && match.p1 && match.p2 && (match.isRoundRobinGroup || match.isTieBreaker ? setRoundRobinScore(idx, 'p2', score) : setSwissScore(idx, 'p2', score))" :class="match.score2 === score ? 'bg-indigo-600 text-white shadow ring-2 ring-indigo-300' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="w-8 h-8 rounded text-xs font-bold border border-slate-700 transition" x-text="score"></button>
                    </template>
                  </div>
                </template>
                <template x-if="tournamentType === 'knockout' && !match.isRoundRobinGroup && !match.isTieBreaker">
                  <button x-show="isHost && match.p2 && match.p2 !== '等待晉級 (TBD)' && match.p2 !== '輪空 (BYE)'" @click="setWinner(idx, match.p2)" :class="match.winner === match.p2 ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'" class="px-3 py-1.5 rounded text-sm transition font-bold">
                    <i class="fa-solid fa-trophy mr-1"></i> 勝出
                  </button>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </main>

    <!-- Tab 2: 即時排行榜 / 樹狀圖 (Rankings / Bracket) -->
    <main x-show="activeTab === 'rankings'" class="space-y-6">
      <!-- 單淘汰樹狀圖視角 -->
      <template x-if="tournamentType === 'knockout'">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 overflow-x-auto">
          <h3 class="text-lg font-bold mb-4 text-indigo-300"><i class="fa-solid fa-sitemap mr-2"></i>單淘汰完整對戰樹狀圖 (含特殊賽制與季殿軍)</h3>
          <div class="flex gap-8 min-w-[800px]">
            <template x-for="(roundMatches, rIdx) in bracketHistory" :key="rIdx">
              <div class="flex flex-col justify-around flex-1 gap-3">
                <div class="text-xs font-bold text-slate-400 text-center uppercase tracking-wider mb-2" x-text="roundMatches[0] && roundMatches[0].roundTitle ? roundMatches[0].roundTitle : ('第 ' + (rIdx + 1) + ' 輪')"></div>
                <template x-for="m in roundMatches" :key="m.id">
                  <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 space-y-2 text-xs">
                    <div class="text-indigo-400 font-semibold mb-1" x-text="m.title || '對戰組'"></div>
                    <div class="flex justify-between text-sm py-1 px-2 rounded" :class="m.winner && m.winner === m.p1 ? 'bg-emerald-950/60 text-emerald-400 font-bold border border-emerald-600/50' : 'text-slate-300'">
                      <span x-text="m.p1 || 'TBD'"></span>
                      <i x-show="m.winner && m.winner === m.p1" class="fa-solid fa-check text-xs"></i>
                    </div>
                    <div class="border-t border-slate-800"></div>
                    <div class="flex justify-between text-sm py-1 px-2 rounded" :class="m.winner && m.winner === m.p2 ? 'bg-emerald-950/60 text-emerald-400 font-bold border border-emerald-600/50' : 'text-slate-300'">
                      <span x-text="m.p2 || 'TBD'"></span>
                      <i x-show="m.winner && m.winner === m.p2" class="fa-solid fa-check text-xs"></i>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- 瑞士制排行榜視角 -->
      <template x-if="tournamentType === 'swiss'">
        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
          <div class="p-4 bg-slate-900/80 border-b border-slate-700 flex justify-between items-center">
            <h3 class="font-bold text-lg text-indigo-300"><i class="fa-solid fa-list-ol mr-2"></i>瑞士制即時積分排行榜</h3>
            <span class="text-xs text-slate-400">依據勝場數、Buchholz 小分與總得分排序</span>
          </div>
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-900/50 text-slate-400 text-sm border-b border-slate-700">
                <th class="p-4">排名</th>
                <th class="p-4">選手名稱</th>
                <th class="p-4">勝場</th>
                <th class="p-4">總得分</th>
                <th class="p-4">Buchholz 小分</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(p, rank) in sortedPlayers" :key="p.name">
                <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 transition">
                  <td class="p-4 font-bold text-indigo-400" x-text="rank + 1"></td>
                  <td class="p-4 font-semibold text-slate-100" x-text="p.name"></td>
                  <td class="p-4 text-emerald-400 font-bold" x-text="p.wins"></td>
                  <td class="p-4 text-slate-300" x-text="p.points"></td>
                  <td class="p-4 text-pink-400 font-semibold" x-text="p.buchholz.toFixed(1)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </main>

    <!-- Tab 3: 賽事設定 (Settings) - 嚴格受 isHost 控制 -->
    <main x-show="activeTab === 'settings' && isHost" class="space-y-6">
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-6">
        <h2 class="text-xl font-bold border-b border-slate-700 pb-3 flex items-center gap-2">
          <i class="fa-solid fa-gear text-indigo-400"></i> 賽事基本設定
        </h2>

        <!-- 賽制選擇 -->
        <div class="space-y-2">
          <label class="block font-medium text-slate-300">選擇賽制模式</label>
          <div class="grid grid-cols-2 gap-4">
            <button @click="tournamentType = 'swiss'" :class="tournamentType === 'swiss' ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'" class="p-4 rounded-xl border font-bold text-center transition flex flex-col items-center gap-2">
              <i class="fa-solid fa-diagram-project text-2xl"></i>
              <span>瑞士制 (Swiss System)</span>
            </button>
            <button @click="tournamentType = 'knockout'" :class="tournamentType === 'knockout' ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'" class="p-4 rounded-xl border font-bold text-center transition flex flex-col items-center gap-2">
              <i class="fa-solid fa-sitemap text-2xl"></i>
              <span>單淘汰賽 (含季殿軍)</span>
            </button>
          </div>
        </div>

        <!-- 人數快速設定 (支援 4 / 6 / 8 / 12 / 16 / 18 / 20 / 24 / 28 / 32 / 40 / 48) -->
        <div class="space-y-2">
          <label class="block font-medium text-slate-300">快速設定選手人數</label>
          <div class="flex flex-wrap gap-2">
            <template x-for="cnt in [4, 6, 8, 12, 16, 18, 20, 24, 28, 32, 40, 48]">
              <button @click="setPlayerCount(cnt)" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-lg text-sm font-bold transition" x-text="cnt + ' 人'"></button>
            </template>
          </div>
        </div>

        <!-- 輪次設定 (針對瑞士制) -->
        <div class="space-y-2" x-show="tournamentType === 'swiss'">
          <div class="flex justify-between items-center">
            <label class="block font-medium text-slate-300">瑞士制預定輪次 (可自訂)</label>
            <span class="text-xs text-indigo-300" x-text="'建議輪次：' + recommendedRounds + ' 輪'"></span>
          </div>
          <select x-model.number="totalRounds" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500">
            <option value="2">2 輪 (適合 4 人)</option>
            <option value="3">3 輪 (適合 6-8 人)</option>
            <option value="4">4 輪 (適合 12-16 人)</option>
            <option value="5">5 輪 (適合 20-32 人)</option>
            <option value="6">6 輪 (深度積分賽)</option>
          </select>
        </div>

        <!-- 選手名單管理 -->
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label class="block font-medium text-slate-300">選手名單 (編號 01 起，每行一位選手)</label>
            <button @click="randomizePlayers()" class="px-3 py-1 bg-pink-600 hover:bg-pink-500 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 shadow">
              <i class="fa-solid fa-shuffle"></i> 隨機打亂名單
            </button>
          </div>
          <textarea x-model="rawPlayerNames" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500 font-mono" placeholder="選手 01&#10;選手 02..."></textarea>
        </div>

        <!-- 重新重置按鈕 -->
        <div class="pt-4 border-t border-slate-700 flex justify-end">
          <button @click="applySettingsAndReset()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition flex items-center gap-2">
            <i class="fa-solid fa-rotate-right"></i> 套用設定並重新開始賽程
          </button>
        </div>
      </div>
    </main>

  </div>

  <script>
    function tournamentApp() {
      return {
        isHost: true,
        activeTab: 'matches',
        tournamentType: 'swiss',
        currentRound: 1,
        totalRounds: 4,
        rawPlayerNames: '選手 01\n選手 02\n選手 03\n選手 04\n選手 05\n選手 06\n選手 07\n選手 08\n選手 09\n選手 10\n選手 11\n選手 12\n選手 13\n選手 14\n選手 15\n選手 16',
        players: [],
        currentMatches: [],
        bracketHistory: [],
        isTournamentFinished: false,
        podium: { first: '', second: '', third: '', fourth: '' },
        cloudStatus: '連線中...',
        roomReady: false,
        toast: { show: false, message: '' },
        _isSyncing: false,
        lastRemoteUpdate: 0,

        get systemModeText() {
          return this.isHost ? '主控端 (可編輯)' : '觀眾端 (僅供檢視)';
        },

        get recommendedRounds() {
          const count = this.players.length || this.rawPlayerNames.split('\n').filter(n => n.trim()).length;
          if (count <= 4) return 2;
          if (count <= 8) return 3;
          if (count <= 16) return 4;
          return 5;
        },

        get roundRobinLiveStandings() {
          let stats = {};
          this.currentMatches.forEach(m => {
            if (!m.isRoundRobinGroup) return;
            if (m.p1 && !stats[m.p1]) stats[m.p1] = { name: m.p1, wins: 0, points: 0 };
            if (m.p2 && !stats[m.p2]) stats[m.p2] = { name: m.p2, wins: 0, points: 0 };
            if (m.completed) {
              if (m.p1) stats[m.p1].points += (m.score1 || 0);
              if (m.p2) stats[m.p2].points += (m.score2 || 0);
              if (m.winner === m.p1 && m.p1) stats[m.p1].wins++;
              if (m.winner === m.p2 && m.p2) stats[m.p2].wins++;
            }
          });
          return Object.values(stats).sort((a, b) => (b.wins - a.wins) || (b.points - a.points));
        },

        get sortedPlayers() {
          this.players.forEach(p => {
            if (!p.opponents) p.opponents = [];
            if (p.points === undefined) p.points = 0;
            p.buchholz = 0;
            p.opponents.forEach(oppName => {
              const opp = this.players.find(x => x.name === oppName);
              if (opp) p.buchholz += (opp.points || 0);
            });
          });

          return [...this.players].sort((a, b) => {
            if ((b.wins || 0) !== (a.wins || 0)) return (b.wins || 0) - (a.wins || 0);
            if (b.buchholz !== a.buchholz) return b.buchholz - a.buchholz;
            return (b.points || 0) - (a.points || 0);
          });
        },

        async init() {
          const urlParams = new URLSearchParams(window.location.search);
          if (urlParams.get('mode') === 'viewer') {
            this.isHost = false;
          }

          // Zero-config Cloud Sync init with robust try/catch fallback for offline/sandboxes
          await this.initZeroConfigCloud();

          if (this.isHost) {
            this.applySettingsAndReset();
          }
        },

        async initZeroConfigCloud() {
          try {
            const urlParams = new URLSearchParams(window.location.search);
            let roomId = urlParams.get('room');

            if (!roomId && this.isHost) {
              this.cloudStatus = '正在建立雲端房間...';
              try {
                const res = await fetch('https://jsonblob.com/api/jsonBlob', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                  body: JSON.stringify({ initialized: true, updatedAt: Date.now() })
                });
                if (res.ok) {
                  const location = res.headers.get('Location');
                  if (location) {
                    roomId = location.split('/').pop();
                    const newUrl = new URL(window.location.href);
                    newUrl.searchParams.set('room', roomId);
                    window.history.replaceState({}, '', newUrl);
                  }
                }
              } catch (fetchErr) {
                console.warn("Cloud sync unavailable, falling back to Local Mode.", fetchErr);
              }
            }

            if (roomId) {
              this.roomReady = true;
              this.cloudStatus = '雲端即時同步已連線';

              if (!this.isHost) {
                // Viewer polling loop (every 2.5s)
                setInterval(async () => {
                  try {
                    const res = await fetch(`https://jsonblob.com/api/jsonBlob/${roomId}`, {
                      headers: { 'Accept': 'application/json' }
                    });
                    if (res.ok) {
                      const data = await res.json();
                      if (data && data.updatedAt && data.updatedAt > this.lastRemoteUpdate) {
                        this._isSyncing = true;
                        this.tournamentType = data.tournamentType || 'swiss';
                        this.currentRound = data.currentRound || 1;
                        this.totalRounds = data.totalRounds || 4;
                        this.players = (data.players || []).map(p => ({
                          name: p.name || '',
                          wins: p.wins || 0,
                          losses: p.losses || 0,
                          points: p.points || 0,
                          buchholz: p.buchholz || 0,
                          opponents: p.opponents || []
                        }));
                        this.currentMatches = data.currentMatches || [];
                        this.bracketHistory = data.bracketHistory || [];
                        this.isTournamentFinished = data.isTournamentFinished || false;
                        this.podium = data.podium || { first: '', second: '', third: '', fourth: '' };
                        this.lastRemoteUpdate = data.updatedAt;
                        setTimeout(() => { this._isSyncing = false; }, 100);
                        this.cloudStatus = '即時同步中 (Live)';
                      }
                    }
                  } catch (err) {
                    this.cloudStatus = '同步連線中斷，重試中...';
                  }
                }, 2500);
              } else {
                this.saveToCloud();
              }
            } else {
              this.roomReady = false;
              this.cloudStatus = '離線模式 (請檢查網路)';
            }
          } catch (e) {
            this.roomReady = false;
            this.cloudStatus = '離線模式';
          }
        },

        async saveToCloud() {
          if (!this.isHost || this._isSyncing) return;
          try {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');
            if (!roomId) return;

            await fetch(`https://jsonblob.com/api/jsonBlob/${roomId}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify({
                tournamentType: this.tournamentType,
                currentRound: this.currentRound,
                totalRounds: this.totalRounds,
                players: this.players,
                currentMatches: this.currentMatches,
                bracketHistory: this.bracketHistory,
                isTournamentFinished: this.isTournamentFinished,
                podium: this.podium,
                updatedAt: Date.now()
              })
            });
            this.cloudStatus = '雲端已同步';
          } catch (e) {
            this.cloudStatus = '本機離線模式';
          }
        },

        showNotification(msg) {
          this.toast.message = msg;
          this.toast.show = true;
          setTimeout(() => { this.toast.show = false; }, 3000);
        },

        toggleMode() {
          this.isHost = !this.isHost;
          if (!this.isHost && this.activeTab === 'settings') {
            this.activeTab = 'matches';
          }
          this.showNotification(`已切換為：${this.systemModeText}`);
        },

        copyViewerLink() {
          const urlParams = new URLSearchParams(window.location.search);
          const roomId = urlParams.get('room');
          if (!roomId || !this.roomReady) {
            this.showNotification('雲端房間正在建立中，請稍候 2 秒再點擊複製！');
            return;
          }

          const url = new URL(window.location.href);
          url.searchParams.set('mode', 'viewer');
          
          const textArea = document.createElement('textarea');
          textArea.value = url.toString();
          textArea.style.position = 'fixed';
          textArea.style.top = '0';
          textArea.style.left = '0';
          textArea.style.opacity = '0';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          
          try {
            const successful = document.execCommand('copy');
            if (successful) {
              this.showNotification('觀眾端即時同步連結已複製到剪貼簿！');
            } else {
              this.showNotification('無法自動複製，請手動複製網址。');
            }
          } catch (err) {
            this.showNotification('無法自動複製，請手動複製網址。');
          }
          document.body.removeChild(textArea);
        },

        setPlayerCount(count) {
          let names = [];
          for (let i = 1; i <= count; i++) {
            const numStr = String(i).padStart(2, '0');
            names.push(`選手 ${numStr}`);
          }
          this.rawPlayerNames = names.join('\n');
          if (count <= 4) this.totalRounds = 2;
          else if (count <= 8) this.totalRounds = 3;
          else if (count <= 16) this.totalRounds = 4;
          else this.totalRounds = 5;
          this.showNotification(`已載入 ${count} 人預設名單！`);
        },

        randomizePlayers() {
          let names = this.rawPlayerNames.split('\n').map(n => n.trim()).filter(n => n.length > 0);
          if (names.length < 2) {
            this.showNotification('選手人數不足，無法打亂！');
            return;
          }
          for (let i = names.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [names[i], names[j]] = [names[j], names[i]];
          }
          this.rawPlayerNames = names.join('\n');
          this.showNotification('選手名單順序已隨機打亂！');
        },

        applySettingsAndReset() {
          if (!this.isHost) return;
          const names = this.rawPlayerNames.split('\n').map(n => n.trim()).filter(n => n.length > 0);
          if (names.length < 2) {
            this.showNotification('請至少輸入 2 位選手名稱！');
            return;
          }

          this.players = names.map(name => ({
            name,
            wins: 0,
            losses: 0,
            points: 0,
            buchholz: 0,
            opponents: []
          }));
          this.currentRound = 1;
          this.bracketHistory = [];
          this.isTournamentFinished = false;
          this.podium = { first: '', second: '', third: '', fourth: '' };

          this.generateFullTournament();
          this.activeTab = 'matches';
          this.showNotification('賽事已重新設定並生成完整對戰樹狀圖與第一輪賽程！');
          this.saveToCloud();
        },

        generateSwissRound() {
          this.currentMatches = [];
          const pool = [...this.players].sort(() => Math.random() - 0.5);
          for (let i = 0; i < pool.length; i += 2) {
            this.currentMatches.push({
              id: `swiss_r${this.currentRound}_m${i/2}`,
              title: `第 ${this.currentRound} 輪桌次 ${i/2 + 1}`,
              p1: pool[i].name,
              p2: pool[i+1] ? pool[i+1].name : '輪空 (BYE)',
              score1: 0,
              score2: 0,
              winner: pool[i+1] ? null : pool[i].name,
              completed: !pool[i+1]
            });
          }
        },

        setSwissScore(matchIndex, playerKey, score) {
          if (!this.isHost) return;
          const match = this.currentMatches[matchIndex];
          if (playerKey === 'p1') match.score1 = score;
          if (playerKey === 'p2') match.score2 = score;

          if (match.score1 !== undefined && match.score2 !== undefined) {
            match.completed = true;
            const p1Obj = this.players.find(p => p.name === match.p1);
            const p2Obj = this.players.find(p => p.name === match.p2);
            if (p1Obj && p2Obj && match.p2 !== '輪空 (BYE)') {
              if (!p1Obj.opponents.includes(match.p2)) p1Obj.opponents.push(match.p2);
              if (!p2Obj.opponents.includes(match.p1)) p2Obj.opponents.push(match.p1);
            }

            if (match.score1 > match.score2) match.winner = match.p1;
            else if (match.score2 > match.score1) match.winner = match.p2;
            else match.winner = '平手';
          }
          this.saveToCloud();
        },

        setRoundRobinScore(matchIndex, playerKey, score) {
          if (!this.isHost) return;
          const match = this.currentMatches[matchIndex];
          if (playerKey === 'p1') match.score1 = score;
          if (playerKey === 'p2') match.score2 = score;

          if (match.score1 !== undefined && match.score2 !== undefined) {
            match.completed = true;
            if (match.score1 > match.score2) match.winner = match.p1;
            else if (match.score2 > match.score1) match.winner = match.p2;
            else match.winner = '平手';
          }
          if (this.bracketHistory[this.currentRound - 1] && !match.isTieBreaker) {
            this.bracketHistory[this.currentRound - 1][matchIndex] = match;
          }
          this.saveToCloud();
        },

        setWinner(matchIndex, winnerName) {
          if (!this.isHost || !winnerName) return;
          const match = this.currentMatches[matchIndex];
          match.winner = winnerName;
          match.completed = true;

          if (this.bracketHistory[this.currentRound - 1]) {
            this.bracketHistory[this.currentRound - 1][matchIndex] = match;
          }

          // Propagate winner in knockout mode immediately
          if (this.tournamentType === 'knockout' && !match.isRoundRobinGroup && !match.isTieBreaker) {
            this.autoPopulateNextRound(this.currentRound - 1);
          }
          this.saveToCloud();
        },

        autoPopulateNextRound(roundIdx) {
          const currentRoundMatches = this.bracketHistory[roundIdx];
          const nextRoundMatches = this.bracketHistory[roundIdx + 1];
          if (!currentRoundMatches || !nextRoundMatches) return;

          // Case 1: Next round is 3-player Round Robin
          if (nextRoundMatches.some(m => m.isRoundRobinGroup)) {
            const advancing = currentRoundMatches.map(m => m.winner).filter(Boolean);
            nextRoundMatches[0].p1 = advancing[0] || '';
            nextRoundMatches[0].p2 = advancing[1] || '';
            nextRoundMatches[1].p1 = advancing[1] || '';
            nextRoundMatches[1].p2 = advancing[2] || '';
            nextRoundMatches[2].p1 = advancing[0] || '';
            nextRoundMatches[2].p2 = advancing[2] || '';
            return;
          }

          // Case 2: Semifinals (2 matches) advancing to Finals + 3rd Place Match
          if (currentRoundMatches.length === 2 && nextRoundMatches.length === 2 && nextRoundMatches[1].id === 'third') {
            const m0 = currentRoundMatches[0];
            const m1 = currentRoundMatches[1];

            nextRoundMatches[0].p1 = m0.winner || '';
            nextRoundMatches[1].p1 = m0.winner ? (m0.winner === m0.p1 ? m0.p2 : m0.p1) : '';

            nextRoundMatches[0].p2 = m1.winner || '';
            nextRoundMatches[1].p2 = m1.winner ? (m1.winner === m1.p1 ? m1.p2 : m1.p1) : '';
            return;
          }

          // Case 3: Unified slot propagation (supports standard binary rounds AND rounds with BYE slots)
          const slots = [];
          nextRoundMatches.forEach(nm => {
            if (nm.isByeMatch) {
              slots.push({ match: nm, key: 'p1', isBye: true });
            } else {
              slots.push({ match: nm, key: 'p1', isBye: false });
              slots.push({ match: nm, key: 'p2', isBye: false });
            }
          });

          let hasByeUpdated = false;
          currentRoundMatches.forEach((m, idx) => {
            const slot = slots[idx];
            if (!slot) return;
            slot.match[slot.key] = m.winner || '';
            if (slot.isBye) {
              slot.match.winner = m.winner || null;
              slot.match.completed = Boolean(m.winner);
              if (m.winner) hasByeUpdated = true;
            }
          });

          if (hasByeUpdated) {
            this.autoPopulateNextRound(roundIdx + 1);
          }
        },

        generateFullTournament() {
          this.bracketHistory = [];
          const names = this.players.map(p => p.name);
          const pool = [...names];
          const n = this.players.length;

          if (this.tournamentType === 'knockout') {
            if (n === 4 || n === 8 || n === 16 || n === 32) {
              let currentCount = n;
              let rIndex = 1;
              while (currentCount >= 2) {
                let matchCount = currentCount / 2;
                let roundMatches = [];
                for (let i = 0; i < matchCount; i++) {
                  let title = currentCount === 2 ? `冠亞軍爭奪戰` : (currentCount === 4 ? `準決賽 ${i+1}` : `第 ${rIndex} 輪晉級賽 ${i+1}`);
                  let roundTitle = currentCount === 2 ? '決賽' : (currentCount === 4 ? '準決賽' : `第 ${rIndex} 輪`);
                  
                  if (rIndex === 1) {
                    roundMatches.push({ id: `r1_${i}`, roundTitle: '第一輪', title: `桌次 ${i+1}`, p1: pool[i*2]||'', p2: pool[i*2+1]||'', winner: null, completed: false });
                  } else {
                    roundMatches.push({ id: `r${rIndex}_${i}`, roundTitle, title, p1: '', p2: '', winner: null, completed: false });
                  }
                }
                this.bracketHistory.push(roundMatches);
                currentCount = matchCount;
                rIndex++;
                if (currentCount === 1) break;
              }
              let finals = this.bracketHistory[this.bracketHistory.length - 1];
              let third = { id: `third`, roundTitle: '決賽', title: '季殿軍爭奪戰', p1: '', p2: '', winner: null, completed: false };
              finals.push(third);

            } else if (n === 6 || n === 12 || n === 18 || n === 24 || n === 48) {
              if (n === 6) {
                let r1 = [];
                for (let i = 0; i < 3; i++) r1.push({ id: `r1_${i}`, roundTitle: '第一輪 (6進3)', title: `晉級賽 ${i+1}`, p1: pool[i*2]||'', p2: pool[i*2+1]||'', winner: null, completed: false });
                this.bracketHistory.push(r1);
              } else if (n === 12) {
                let r1 = [];
                for (let i = 0; i < 6; i++) r1.push({ id: `r1_${i}`, roundTitle: '第一輪 (12進6)', title: `桌次 ${i+1}`, p1: pool[i*2]||'', p2: pool[i*2+1]||'', winner: null, completed: false });
                this.bracketHistory.push(r1);
                let r2 = [];
                for (let i = 0; i < 3; i++) r2.push({ id: `r2_${i}`, roundTitle: '第二輪 (6進3)', title: `晉級賽 ${i+1}`, p1: '', p2: '', winner: null, completed: false });
                this.bracketHistory.push(r2);
              } else if (n === 18) {
                let r1 = [];
                for (let i = 0; i < 9; i++) r1.push({ id: `r1_${i}`, roundTitle: '第一輪 (18進9)', title: `桌次 ${i+1}`, p1: pool[i*2]||'', p2: pool[i*2+1]||'', winner: null, completed: false });
                this.bracketHistory.push(r1);
                let r2 = [];
                for (let i = 0; i < 5; i++) {
                  if (i === 0) r2.push({ id: `r2_0`, roundTitle: '第二輪 (9進5)', title: `輪空種子直通`, p1: '', p2: '輪空 (BYE)', winner: null, completed: false, isByeMatch: true });
                  else r2.push({ id: `r2_${i}`, roundTitle: '第二輪 (9進5)', title: `晉級賽 ${i}`, p1: '', p2: '', winner: null, completed: false });
                }
                this.bracketHistory.push(r2);
                let r3 = [];
                for (let i = 0; i < 3; i++) {
                  if (i === 0) r3.push({ id: `r3_0`, roundTitle: '第三輪 (5進3)', title: `輪空種子直通`, p1: '', p2: '輪空 (BYE)', winner: null, completed: false, isByeMatch: true });
                  else r3.push({ id: `r3_${i}`, roundTitle: '第三輪 (5進3)', title: `晉級賽 ${i}`, p1: '', p2: '', winner: null, completed: false });
                }
                this.bracketHistory.push(r3);
              } else if (n === 24 || n === 48) {
                let matchCount = n / 2;
                let rIndex = 1;
                while (matchCount >= 3) {
                  let roundMatches = [];
                  for (let i = 0; i < matchCount; i++) {
                    if (rIndex === 1) {
                      roundMatches.push({ id: `r1_${i}`, roundTitle: `第一輪 (${n}進${n/2})`, title: `桌次 ${i+1}`, p1: pool[i*2]||'', p2: pool[i*2+1]||'', winner: null, completed: false });
                    } else {
                      roundMatches.push({ id: `r${rIndex}_${i}`, roundTitle: `第 ${rIndex} 輪 (${matchCount*2}進${matchCount})`, title: `晉級賽 ${i+1}`, p1: '', p2: '', winner: null, completed: false });
                    }
                  }
                  this.bracketHistory.push(roundMatches);
                  matchCount = matchCount / 2;
                  rIndex++;
                }
              }

              let rr = [
                { id: `rr_1`, roundTitle: '三強決賽循環賽', title: '循環賽 A vs B', p1: '', p2: '', score1: 0, score2: 0, winner: null, completed: false, isRoundRobinGroup: true },
                { id: `rr_2`, roundTitle: '三強決賽循環賽', title: '循環賽 B vs C', p1: '', p2: '', score1: 0, score2: 0, winner: null, completed: false, isRoundRobinGroup: true },
                { id: `rr_3`, roundTitle: '三強決賽循環賽', title: '循環賽 A vs C', p1: '', p2: '', score1: 0, score2: 0, winner: null, completed: false, isRoundRobinGroup: true }
              ];
              this.bracketHistory.push(rr);

            } else if (n === 20 || n === 40) {
              // 20 -> 10 -> 5 -> 4 (3人輪空 + 2人打一場) -> 準決賽 -> 決賽
              // 40 -> 20 -> 10 -> 5 -> 4 (3人輪空 + 2人打一場) -> 準決賽 -> 決賽
              let matchCount = n / 2;
              let rIndex = 1;
              while (matchCount >= 5) {
                let roundMatches = [];
                for (let i = 0; i < matchCount; i++) {
                  if (rIndex === 1) {
                    roundMatches.push({ id: `r1_${i}`, roundTitle: `第一輪 (${n}進${n/2})`, title: `桌次 ${i+1}`, p1: pool[i*2]||'', p2: pool[i*2+1]||'', winner: null, completed: false });
                  } else {
                    roundMatches.push({ id: `r${rIndex}_${i}`, roundTitle: `第 ${rIndex} 輪 (${matchCount*2}進${matchCount})`, title: `晉級賽 ${i+1}`, p1: '', p2: '', winner: null, completed: false });
                  }
                }
                this.bracketHistory.push(roundMatches);
                matchCount = matchCount / 2;
                rIndex++;
              }

              // 5進4 階段 (3場輪空直通 + 1場對戰)
              let rFiveToFour = [
                { id: `r5to4_bye1`, roundTitle: '5進4附加賽', title: '四強直通種子 1', p1: '', p2: '輪空 (BYE)', winner: null, completed: false, isByeMatch: true },
                { id: `r5to4_bye2`, roundTitle: '5進4附加賽', title: '四強直通種子 2', p1: '', p2: '輪空 (BYE)', winner: null, completed: false, isByeMatch: true },
                { id: `r5to4_bye3`, roundTitle: '5進4附加賽', title: '四強直通種子 3', p1: '', p2: '輪空 (BYE)', winner: null, completed: false, isByeMatch: true },
                { id: `r5to4_playin`, roundTitle: '5進4附加賽', title: '四強決定戰 (5進4)', p1: '', p2: '', winner: null, completed: false }
              ];
              this.bracketHistory.push(rFiveToFour);

              // 準決賽 (4進2)
              let semis = [
                { id: `semi_1`, roundTitle: '準決賽', title: '準決賽 1', p1: '', p2: '', winner: null, completed: false },
                { id: `semi_2`, roundTitle: '準決賽', title: '準決賽 2', p1: '', p2: '', winner: null, completed: false }
              ];
              this.bracketHistory.push(semis);

              // 決賽 (冠亞軍 + 季殿軍)
              let finals = [
                { id: `final_1`, roundTitle: '決賽', title: '冠亞軍爭奪戰', p1: '', p2: '', winner: null, completed: false },
                { id: `third`, roundTitle: '決賽', title: '季殿軍爭奪戰', p1: '', p2: '', winner: null, completed: false }
              ];
              this.bracketHistory.push(finals);

            } else if (n === 28) {
              // 28 -> 14 -> 7 -> 4 (1人輪空 + 6人打3場) -> 準決賽 -> 決賽
              let r1 = [];
              for (let i = 0; i < 14; i++) r1.push({ id: `r1_${i}`, roundTitle: '第一輪 (28進14)', title: `桌次 ${i+1}`, p1: pool[i*2]||'', p2: pool[i*2+1]||'', winner: null, completed: false });
              this.bracketHistory.push(r1);

              let r2 = [];
              for (let i = 0; i < 7; i++) r2.push({ id: `r2_${i}`, roundTitle: '第二輪 (14進7)', title: `晉級賽 ${i+1}`, p1: '', p2: '', winner: null, completed: false });
              this.bracketHistory.push(r2);

              let r3 = [
                { id: `r7to4_bye`, roundTitle: '第三輪 (7進4)', title: '四強直通種子', p1: '', p2: '輪空 (BYE)', winner: null, completed: false, isByeMatch: true },
                { id: `r7to4_1`, roundTitle: '第三輪 (7進4)', title: '八強晉級賽 1', p1: '', p2: '', winner: null, completed: false },
                { id: `r7to4_2`, roundTitle: '第三輪 (7進4)', title: '八強晉級賽 2', p1: '', p2: '', winner: null, completed: false },
                { id: `r7to4_3`, roundTitle: '第三輪 (7進4)', title: '八強晉級賽 3', p1: '', p2: '', winner: null, completed: false }
              ];
              this.bracketHistory.push(r3);

              let semis = [
                { id: `semi_1`, roundTitle: '準決賽', title: '準決賽 1', p1: '', p2: '', winner: null, completed: false },
                { id: `semi_2`, roundTitle: '準決賽', title: '準決賽 2', p1: '', p2: '', winner: null, completed: false }
              ];
              this.bracketHistory.push(semis);

              let finals = [
                { id: `final_1`, roundTitle: '決賽', title: '冠亞軍爭奪戰', p1: '', p2: '', winner: null, completed: false },
                { id: `third`, roundTitle: '決賽', title: '季殿軍爭奪戰', p1: '', p2: '', winner: null, completed: false }
              ];
              this.bracketHistory.push(finals);

            } else {
              // 其他自訂人數通用處理
              let r1 = [];
              for (let i = 0; i < pool.length; i += 2) {
                const hasP2 = Boolean(pool[i+1]);
                r1.push({
                  id: `r1_${i/2}`,
                  roundTitle: '第一輪',
                  title: `桌次 ${i/2 + 1}`,
                  p1: pool[i],
                  p2: pool[i+1] || '輪空 (BYE)',
                  winner: hasP2 ? null : pool[i],
                  completed: !hasP2
                });
              }
              this.bracketHistory.push(r1);
            }

            this.currentMatches = this.bracketHistory[0];
          } else {
            this.generateSwissRound();
          }
        },

        nextRound() {
          if (!this.isHost) return;
          const uncompleted = this.currentMatches.some(m => !m.completed);
          if (uncompleted) {
            this.showNotification('還有桌次尚未完成登記，請先完成！');
            return;
          }

          if (this.tournamentType === 'swiss') {
            this.bracketHistory.push(JSON.parse(JSON.stringify(this.currentMatches)));
            this.currentMatches.forEach(m => {
              const p1Obj = this.players.find(p => p.name === m.p1);
              const p2Obj = this.players.find(p => p.name === m.p2);
              if (p1Obj) {
                if (p1Obj.points === undefined) p1Obj.points = 0;
                if (m.score1 !== undefined) p1Obj.points += m.score1;
              }
              if (p2Obj) {
                if (p2Obj.points === undefined) p2Obj.points = 0;
                if (m.score2 !== undefined) p2Obj.points += m.score2;
              }

              if (m.winner === m.p1 && p1Obj) p1Obj.wins = (p1Obj.wins || 0) + 1;
              if (m.winner === m.p2 && p2Obj) p2Obj.wins = (p2Obj.wins || 0) + 1;
            });

            this.currentRound++;
            if (this.currentRound > this.totalRounds) {
              const finalRanks = this.sortedPlayers;
              this.podium = {
                first: finalRanks[0]?.name || '',
                second: finalRanks[1]?.name || '',
                third: finalRanks[2]?.name || '',
                fourth: finalRanks[3]?.name || ''
              };
              this.isTournamentFinished = true;
              this.showNotification('瑞士制所有輪次已全部打完！');
              this.saveToCloud();
              return;
            }
            this.generateSwissRound();
          } else {
            // 檢查是否為三強循環賽群組完成或加賽完成
            if (this.currentMatches.some(m => m.isRoundRobinGroup || m.isTieBreaker)) {
              const isHandlingTieBreaker = this.currentMatches.some(m => m.isTieBreaker);

              if (isHandlingTieBreaker) {
                const tbMatch = this.currentMatches[0];
                if (!tbMatch.winner || tbMatch.winner === '平手') {
                  this.showNotification('加賽不可平手，請點選分數分出高下！');
                  return;
                }
                const winner = tbMatch.winner;
                const loser = (winner === tbMatch.p1) ? tbMatch.p2 : tbMatch.p1;

                if (tbMatch.tieType === 'first_second') {
                  this.podium = {
                    first: winner,
                    second: loser,
                    third: tbMatch.fixedThird || '',
                    fourth: ''
                  };
                } else {
                  this.podium = {
                    first: tbMatch.fixedFirst || '',
                    second: winner,
                    third: loser,
                    fourth: ''
                  };
                }

                this.isTournamentFinished = true;
                this.showNotification(`三強加賽結束！冠軍：${this.podium.first} | 亞軍：${this.podium.second} | 季軍：${this.podium.third}`);
                this.saveToCloud();
                return;
              } else {
                // 確保沒有平手場次
                if (this.currentMatches.some(m => m.winner === '平手' || !m.winner)) {
                  this.showNotification('循環賽每場對戰皆須分出勝負（不可同分平手）！');
                  return;
                }

                let stats = {};
                this.currentMatches.forEach(m => {
                  if (m.p1 && !stats[m.p1]) stats[m.p1] = { name: m.p1, wins: 0, points: 0 };
                  if (m.p2 && !stats[m.p2]) stats[m.p2] = { name: m.p2, wins: 0, points: 0 };

                  stats[m.p1].points += (m.score1 || 0);
                  stats[m.p2].points += (m.score2 || 0);

                  if (m.winner === m.p1) stats[m.p1].wins++;
                  if (m.winner === m.p2) stats[m.p2].wins++;
                });

                let sortedArr = Object.values(stats).sort((a, b) => {
                  if (b.wins !== a.wins) return b.wins - a.wins;
                  return b.points - a.points;
                });

                let p1 = sortedArr[0];
                let p2 = sortedArr[1];
                let p3 = sortedArr[2];

                // 情境 A：三人勝場與總得分完全相同 -> 重打一輪循環賽
                if (p1 && p2 && p3 && p1.wins === p2.wins && p1.points === p2.points && p2.wins === p3.wins && p2.points === p3.points) {
                  this.currentMatches.forEach(m => {
                    m.score1 = 0;
                    m.score2 = 0;
                    m.winner = null;
                    m.completed = false;
                  });
                  this.showNotification(`三位選手皆為 ${p1.wins} 勝 ${p1.points} 分完全平手！已重置循環賽比分，請重新進行三強對戰！`);
                  this.saveToCloud();
                  return;
                }

                // 情境 B：第 1 與第 2 名同勝場且同得分 -> 加賽爭奪冠軍與亞軍
                if (p1 && p2 && p1.wins === p2.wins && p1.points === p2.points) {
                  this.currentMatches = [{
                    id: 'tiebreaker_1st_2nd',
                    roundTitle: '冠亞軍同分加賽',
                    title: `冠軍爭奪附加賽：${p1.name} vs ${p2.name}`,
                    p1: p1.name,
                    p2: p2.name,
                    score1: 0,
                    score2: 0,
                    winner: null,
                    completed: false,
                    isTieBreaker: true,
                    tieType: 'first_second',
                    fixedThird: p3?.name || ''
                  }];
                  this.showNotification(`選手 ${p1.name} 與 ${p2.name} 同為 ${p1.wins} 勝 ${p1.points} 分，已產生冠亞軍加賽桌次！`);
                  this.saveToCloud();
                  return;
                }

                // 情境 C（您的舉例 3）：第 2 與第 3 名同勝場且同得分 -> 加賽爭奪亞軍與季軍
                if (p2 && p3 && p2.wins === p3.wins && p2.points === p3.points) {
                  this.currentMatches = [{
                    id: 'tiebreaker_2nd_3rd',
                    roundTitle: '亞季軍同分加賽',
                    title: `亞軍爭奪附加賽：${p2.name} vs ${p3.name}`,
                    p1: p2.name,
                    p2: p3.name,
                    score1: 0,
                    score2: 0,
                    winner: null,
                    completed: false,
                    isTieBreaker: true,
                    tieType: 'second_third',
                    fixedFirst: p1?.name || ''
                  }];
                  this.showNotification(`冠軍為 ${p1.name}！選手 ${p2.name} 與 ${p3.name} 同為 ${p2.wins} 勝 ${p2.points} 分，已產生加賽桌次！`);
                  this.saveToCloud();
                  return;
                }

                // 情境 D（您的舉例 1 & 2）：名次直接分曉，直接結束並公布冠亞季軍
                this.podium = {
                  first: p1?.name || '',
                  second: p2?.name || '',
                  third: p3?.name || '',
                  fourth: ''
                };
                this.isTournamentFinished = true;
                this.showNotification(`三強循環賽圓滿結束！冠軍：${this.podium.first} | 亞軍：${this.podium.second} | 季軍：${this.podium.third}`);
                this.saveToCloud();
                return;
              }
            }

            // 同步目前輪次並自動填入下一輪名單
            this.bracketHistory[this.currentRound - 1] = this.currentMatches;
            this.autoPopulateNextRound(this.currentRound - 1);

            this.currentRound++;
            if (this.currentRound <= this.bracketHistory.length) {
              this.currentMatches = this.bracketHistory[this.currentRound - 1];
            } else {
              // 一般單淘汰決賽（含冠亞軍與季殿軍）完成時統計頒獎台名次
              const lastRound = this.bracketHistory[this.bracketHistory.length - 1];
              if (lastRound && lastRound.length >= 1) {
                const finalMatch = lastRound[0];
                const thirdMatch = lastRound[1];
                this.podium = {
                  first: finalMatch.winner || '',
                  second: finalMatch.winner ? (finalMatch.winner === finalMatch.p1 ? finalMatch.p2 : finalMatch.p1) : '',
                  third: thirdMatch ? (thirdMatch.winner || '') : '',
                  fourth: (thirdMatch && thirdMatch.winner) ? (thirdMatch.winner === thirdMatch.p1 ? thirdMatch.p2 : thirdMatch.p1) : ''
                };
              }
              this.isTournamentFinished = true;
              this.showNotification(`單淘汰賽事圓滿結束！冠軍：${this.podium.first}`);
              this.saveToCloud();
              return;
            }
          }

          this.showNotification(`已成功進入第 ${this.currentRound} 輪賽事！`);
          this.saveToCloud();
        }
      }
    }
  </script>
